name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      # `./run.sh verify` is the same subcommand documented in the README
      # for local use (compile check + pytest + a synthetic-mode engine
      # smoke test + dashboard API check) - CI runs exactly that, not a
      # separate parallel definition of "passing", so a green check here
      # means the same thing `./run.sh verify` means locally. It needs no
      # Wine/MT5/broker connection by design. install.sh and run.sh are the
      # only two .sh files in the project - stop/emergency-stop/verify/
      # doctor all live as subcommands inside run.sh now.
      - name: Run ./run.sh verify
        run: ./run.sh verify

      - name: ruff (real-bug categories only)
        run: |
          .venv/bin/pip install -q ruff
          .venv/bin/ruff check core/ bridge/ tests/ scripts/ main.py dashboard.py \
            --select F,B,SIM,C4 --ignore SIM118

      - name: shellcheck
        run: shellcheck run.sh install.sh
